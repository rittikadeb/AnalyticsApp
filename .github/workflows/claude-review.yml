name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read skills.md at the repository root first — these are the
            custom review guidelines for this repo. They define the
            reviewer persona, focus areas, stack-specific expertise,
            severity labels, and output expectations. Follow them strictly.

            Also read any CLAUDE.md, AGENTS.md, or .cursor/rules files at
            the repo root if they exist; treat them as additional custom
            guidelines.

            Then review this pull request: analyze the diff and post
            actionable findings as review comments on the relevant lines.
            Every comment must start with a severity label as defined in
            skills.md. End with the required severity summary line.
            Skip nitpicks; prioritize substantive issues.
          claude_args: "--max-turns 8"
