name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request. Focus on:
            - Code correctness and bugs
            - Security issues
            - Performance concerns
            - Adherence to existing code style and patterns

            Analyze the diff carefully and post actionable findings as review
            comments on the relevant lines. Skip nitpicks; prioritize substantive
            issues.
          claude_args: "--max-turns 8"
