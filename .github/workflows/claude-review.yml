name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: review (${{ matrix.persona }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        persona: [architecture, correctness, security, performance, style]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the **${{ matrix.persona }}** reviewer for this PR.

            1. Read `.github/review-personas/_common.md` first — it
               defines project context, severity labels, persona
               discipline, and the required output format.
            2. Then read `.github/review-personas/${{ matrix.persona }}.md`
               — that is your scope. Only flag issues that fall inside
               that scope. Issues outside your scope belong to other
               personas; ignore them.
            3. Then review this pull request: analyze the diff and post
               actionable findings as inline review comments on the
               relevant lines.
            4. Open your review with `## [${{ matrix.persona }} review]`
               so it is identifiable next to other personas' reviews.
            5. Every comment must start with a severity label as defined
               in `_common.md`. End with the required severity summary
               line.

            Stay strictly in your lane. A clean review with
            `Summary: no issues found in ${{ matrix.persona }} scope.`
            is a valid outcome — do not invent findings.

            Ignore generated and vendored files. Do not review changes
            in: `node_modules/`, `package-lock.json`, `yarn.lock`,
            `pnpm-lock.yaml`, `bun.lockb`, `.next/`, `dist/`, `build/`,
            `out/`, `coverage/`, `*.min.js`, `*.min.css`, `*.map`,
            `__snapshots__/`, `*.snap`, build-output `*.d.ts`, or any
            file under a path commonly understood to be machine-
            generated. Only review human-authored source.
          claude_args: "--model claude-sonnet-4-5 --max-turns 8"
