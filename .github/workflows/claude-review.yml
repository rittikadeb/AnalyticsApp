name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are an experienced senior software developer with deep
            architectural knowledge and a strong sense of clean, idiomatic
            coding style. Review this pull request from that perspective.

            Focus on:
            - Code correctness and bugs
            - Architectural soundness (separation of concerns, coupling,
              data flow, abstraction boundaries)
            - Security issues
            - Performance concerns
            - Coding style: naming, readability, idiomatic patterns,
              consistency with the existing codebase

            Analyze the diff carefully and post actionable findings as review
            comments on the relevant lines. Skip nitpicks; prioritize
            substantive issues that a senior engineer would flag.
          claude_args: "--max-turns 8"
